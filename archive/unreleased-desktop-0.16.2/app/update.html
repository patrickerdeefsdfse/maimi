<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; connect-src 'none'; img-src 'self'"><title>麦米 · 软件更新</title><style>
:root{color-scheme:light dark;--bg:#f7faf9;--card:#fff;--text:#203b36;--muted:#687d77;--line:#dde9e4;--accent:#238e7c;--soft:#edf7f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px "Segoe UI","Microsoft YaHei",sans-serif;line-height:1.6}main{padding:28px}header{display:flex;align-items:center;gap:13px;margin-bottom:24px}.mark{width:148px;height:auto}h1{font-size:19px;margin:2px 0}p{margin:8px 0;color:var(--muted)}.card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:22px}h2{font-size:17px;margin:0 0 8px;font-weight:600}.status-detail{min-height:46px}.versions{font-size:13px;display:flex;gap:20px;flex-wrap:wrap;margin-top:17px}progress{display:block;width:100%;height:7px;margin:18px 0 5px;accent-color:var(--accent)}[hidden]{display:none!important}.progress-text{font-size:12px;color:var(--muted)}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:21px}button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 15px;background:var(--card);color:var(--text);cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:hover{filter:brightness(.97)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.foot{font-size:12px;margin:17px 2px 0}.notice{font-size:12px;color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#14221f;--card:#1c2c27;--text:#e1eee8;--muted:#a5b9b0;--line:#354a40;--accent:#4bb99f;--soft:#243d32}}
.activity{font-size:12px;color:var(--muted);margin:12px 0 0}.error{font-size:13px;border-left:3px solid #b66c32;background:var(--soft);border-radius:7px;padding:10px 12px;margin-top:14px;color:var(--text)}
</style></head><body><main><header><img class="mark" src="assets/megmeet-wordmark.svg" alt="MEGMEET"><div><h1>软件更新</h1><span class="notice">麦米办公助手</span></div></header><section class="card"><div aria-live="polite"><h2 id="title">正在读取更新状态…</h2><p id="detail" class="status-detail"></p></div><progress id="progress" max="100" aria-label="更新文件实际下载进度" hidden></progress><div id="progress-text" class="progress-text" hidden></div><p id="activity" class="activity" hidden></p><div id="error" class="error" role="alert" hidden></div><div class="versions"><span id="current">当前版本 —</span><span id="available" hidden></span></div><div class="actions"><button id="check">检查更新</button><button id="install" class="primary" hidden>更新并重启</button></div></section><p class="foot" id="checked"></p><p class="foot">更新会保留已保存的聊天和工作文件。请先结束正在运行的任务，并保留未发送的草稿；安装时会显示进度，完成后自动打开新版本。</p></main><script src="update.js"></script></body></html>
