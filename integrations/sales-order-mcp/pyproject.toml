[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "megmeet-order-mcp"
version = "0.1.1"
description = "Sales order extraction and reviewed Oracle submission for DeepSeek Harness"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "pydantic>=2.11,<3", "httpx>=0.28,<1", "websockets==15.0.1", "Pillow>=11,<14", "pypdf>=5,<7", "pypdfium2>=4,<6", "openpyxl>=3.1,<4", "python-dotenv>=1,<2", "oracledb>=3,<5"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1"]

[project.scripts]
megmeet-order-mcp = "order_mcp.server:main"

[tool.setuptools.packages.find]
include = ["order_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
